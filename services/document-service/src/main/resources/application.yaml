spring:
  application:
    name: document-service
  # 기본 프로파일을 dev로 둔다. 운영/스테이징에서는 SPRING_PROFILES_ACTIVE 환경변수로 덮어쓴다.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # CLAUDE.md §5: JSON 필드는 snake_case. DTO 필드는 camelCase로 두고 전역 변환에 의존.
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, info

# 챗봇 Lambda Function URL 호출 설정 (ai-chatbot-mcp.md §6).
# 로컬 PoC: function-url을 localhost mock으로, auth-enabled=false로 두면 IAM 서명 스킵.
# AWS 배포 후: 실제 Function URL + auth-enabled=true + 백엔드 EC2/EKS의 IAM 역할 사용.
chatbot:
  function-url: ${CHATBOT_FUNCTION_URL:http://127.0.0.1:9000/}
  aws-region: ${CHATBOT_AWS_REGION:ap-northeast-2}
  auth-enabled: ${CHATBOT_AUTH_ENABLED:false}
  request-timeout-seconds: 120

# AI 분석 파이프라인 연동 설정 (docs/document-analysis/ai-pipeline.md, result-queue-routing.md).
# - source: Lambda A가 S3 메타데이터에서 읽어 결과 경로를 분기한다. dev=development(온프렘 직결),
#   stage/prod=production(SQS 경유). 환경별 application-{env}.yml에서 덮어쓴다.
# - result-queue-arn: production 계열에서만 S3 메타데이터에 주입. 환경별로 다른 큐를 가리킨다.
# - request-queue-url: retry 시 Lambda A를 재트리거할 요청 큐. 운영(!dev)에서 비어 있으면 retry 시 예외.
# - upload-bucket: Pre-signed PUT URL이 가리킬 S3 버킷.
gb:
  analysis:
    source: ${GB_ANALYSIS_SOURCE:development}
    result-queue-arn: ${GB_ANALYSIS_RESULT_QUEUE_ARN:}
    request-queue-url: ${GB_ANALYSIS_REQUEST_QUEUE_URL:}
    upload-bucket: ${GB_ANALYSIS_UPLOAD_BUCKET:gb-document-uploads-dev}
    upload-url-expires-seconds: ${GB_ANALYSIS_UPLOAD_URL_EXPIRES_SECONDS:600}
    aws-region: ${GB_ANALYSIS_AWS_REGION:ap-northeast-2}