dependencies {
    implementation project(':common:common-exception')
    implementation project(':common:common-response')
    implementation project(':common:common-security')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 검표원(방식 B): issuer-uri 기반 JWT(RS256/JWKS) 검증. Jwt/JwtAuthenticationToken/JwtDecoder 및
    // oauth2ResourceServer().jwt() DSL을 제공한다. starter-security만으론 미포함(wallet/member/community와 동일).
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // (제거됨) spring-boot-starter-data-redis — 코드에서 사용처 0건. Spring 자동설정으로 health
    //         indicator 만 등록되어 /actuator/health 가 DOWN 으로 떨어지는 부작용이 있어 제거.
    //         추후 캐싱·rate-limit 등 도입 시 재추가.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Phase 1: /actuator/prometheus 노출용 — Phase 2(Grafana/Prometheus 인프라)에서 스크레이프할 자리.
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

    // R1 PoC — Lambda Function URL을 IAM(SigV4)로 서명해 호출하기 위한 AWS SDK v2 auth 모듈.
    // HTTP 자체는 Java 17 java.net.http.HttpClient로 처리하고, 여기서는 서명 유틸만 사용한다.
    //
    // BOM 순서: spring-cloud-aws BOM(아래)이 AWS SDK 버전을 관리(3.4.2 = AWS SDK 2.31.x).
    // awssdk:bom을 먼저 선언 후 spring-cloud-aws BOM이 뒤따라 적용된다.
    implementation platform('software.amazon.awssdk:bom:2.31.0')
    // SQS Consumer(@SqsListener) — Spring Boot 3.5 호환 라인은 3.4.x (3.4.0이 Boot 3.5.0으로 업그레이드).
    // 3.4.2가 3.4 계열 최신 패치(2025-12-01). 컨테이너가 폴링/visibility 연장/ack-on-success를 책임진다.
    // 상세: docs/document-analysis/result-queue-routing.md §3, result-json-schema-agreement.md §1.
    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:3.4.2')
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs'
    implementation 'software.amazon.awssdk:auth'
    implementation 'software.amazon.awssdk:http-client-spi'
    // 분석 요청용 S3 Pre-signed PUT URL 발급 + Lambda 재트리거(SQS publish — 동기 SqsClient).
    // 결과 수신은 위 starter-sqs(@SqsListener)가 SqsAsyncClient를 auto-config로 만들어 처리.
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sqs'
    // IRSA(웹아이덴티티) 자격증명용 — 없으면 DefaultCredentialsProvider가 AssumeRoleWithWebIdentity를
    // 조용히 건너뛰고 IMDS(노드 롤)로 폴백한다. stage/prod에서 SA IRSA로 SQS/S3/Lambda를 호출하려면 필수.
    // (Spring Cloud AWS 기본 자격증명 체인 + ChatbotLambdaClientImpl의 DefaultCredentialsProvider 둘 다 해당)
    implementation 'software.amazon.awssdk:sts'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // 테스트 전용 인메모리 DB(application-test.yml에서 MODE=MySQL로 사용).
    testRuntimeOnly 'com.h2database:h2'
}