dependencies {
    implementation project(':common:common-exception')
    implementation project(':common:common-response')
    implementation project(':common:common-security')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    // 2.8.15~2.8.17은 /swagger-ui/**/*swagger-initializer.js 패턴 버그(#3146 회귀)로 기동 실패.
    // 2.8.14가 2.8 계열 마지막 정상 버전(ant_path_matcher 설정으로도 해결 안 됨). 패치 버전 나오면 재상향.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // 테스트 전용 인메모리 DB. spring-boot-starter-test는 루트 build.gradle subprojects에서 이미 적용됨.
    testRuntimeOnly 'com.h2database:h2'
}