# 테스트 전용 프로파일. @ActiveProfiles("test")로 활성화.
# 인메모리 H2(MySQL 호환 모드)로 Repository 통합 테스트를 돌린다 — 개발기 DB는 절대 만지지 않는다.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop          # 테스트마다 스키마 생성/삭제
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: never
  # Kafka: 테스트엔 브로커가 없다. 통합 테스트(@SpringBootTest)가 실제 커밋을 하면 AFTER_COMMIT 발행
  # (MilestoneEventPublisher)이 send()를 시도하는데, 블로킹 상한을 바짝 줄여(기본 60s → 100ms) 즉시
  # 실패(ERROR 로그)하고 지나가게 한다 — 발행 실패는 비즈니스 흐름에 영향 없음(BE-3 설계 그대로).
  kafka:
    bootstrap-servers: localhost:9092
  jackson:
    # main과 동일한 전역 규칙(응답 JSON 검증 시 대비).
    property-naming-strategy: SNAKE_CASE
  # Redis: 테스트에서 실제 호출은 (c)단계 테스트에서 @MockitoBean으로 차단할 예정. 여기는 @Value 해석용 더미.
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1s
  # 테스트에선 Redis가 안 떠 있다. RedissonAutoConfigurationV2가 RedisTemplate + RedissonConnectionFactory를
  # eager wire하면서 우리 @Lazy RedissonClient 빈을 강제 실체화 → 연결 실패로 컨텍스트가 깨지므로 제외한다.
  # 우리 RedisConfig.redissonClient 빈은 그대로 살아있고, (c)단계 테스트에서 @MockitoBean으로 대체된다.
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

# 테스트 환경에선 Redis가 안 떠 있으므로 actuator의 Redis health contributor도 비활성화.
management:
  health:
    redis:
      enabled: false

# BankClientConfig가 RestClient 빈 등록 시 사용하는 base URL.
# 테스트는 외부 Mock 은행을 실제로 호출하지 않지만, @Value 해석을 위해 더미 값을 둔다.
bank:
  api:
    base-url: http://localhost:0

# Kafka send() 블로킹 상한(위 spring.kafka 주석 참고) — 브로커 없는 테스트에서 100ms로 즉시 실패시킨다.
gb:
  kafka:
    producer:
      max-block-ms: 100
