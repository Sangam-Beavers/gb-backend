# stage 프로파일 — 모든 값은 환경변수로 주입 (실제 값 절대 기재 금지)
# DB 접속 정보(host/port/dbname/user/pass)는 AWS Secrets Manager → ESO → k8s Secret 경유
# Cognito issuer URI는 ConfigMap(gb-infra values-stage.yaml)에서 주입
spring:
  datasource:
    # DB_HOST / DB_PORT / DB_NAME 은 SM secret(sb/stage/wallet/db)에서 ESO가 주입
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate        # stage/prod에서는 validate (update 금지 — 스키마는 Flyway/수동 관리)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false             # 운영 환경에서는 SQL 로그 끔

  data:
    redis:
      # REDIS_HOST 는 ConfigMap, SPRING_DATA_REDIS_PASSWORD 는 SM secret(sb/stage/redis/auth)
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      database: 0
      timeout: 3s

  security:
    oauth2:
      resourceserver:
        jwt:
          # AUTH_ISSUER_URI = Cognito issuer (ConfigMap에서 주입)
          issuer-uri: ${AUTH_ISSUER_URI}

# 외부 Mock 은행 base URL — BANK_API_BASE_URL (ConfigMap)
bank:
  api:
    base-url: ${BANK_API_BASE_URL}

# member-service 내부 호출 URL — MEMBER_API_BASE_URL (ConfigMap)
member:
  api:
    base-url: ${MEMBER_API_BASE_URL}
