spring:
  application:
    name: wallet-service
  profiles:
    # 기본 활성 프로파일을 dev로 둔다(타 3서비스와 동일 패턴 — 11D config-build-3 정합).
    # 운영/스테이징은 SPRING_PROFILES_ACTIVE 환경변수로 덮어쓴다.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    # 전역 설정: 모든 응답 JSON 필드명을 camelCase → snake_case로 직렬화 (명세 규칙).
    property-naming-strategy: SNAKE_CASE
  kafka:
    # Kafka 브로커 주소 — 환경변수 주입(Phase 2 스파이크 결정 6, env 분리 패턴 동일).
    # 브로커 미기동 환경(dev 로컬 등)에서도 앱은 정상 기동하고, 발행 실패만 ERROR 로그로 남는다(BE-3).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Phase 2 — 마일스톤 이벤트 발행(Kafka Producer). KafkaProducerConfig 참조.
gb:
  kafka:
    producer:
      # 브로커 미가용 시 send() 블로킹 상한(ms, Kafka 기본 60s). AFTER_COMMIT 발행이 API 응답
      # 스레드에서 동기 실행되므로 짧게 캡해 Kafka 장애가 충전/송금 응답 지연으로 번지지 않게 한다.
      max-block-ms: 3000

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        # Phase 1: prometheus 엔드포인트 노출(Phase 2에서 Prometheus가 스크레이프).
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s

# 충전 정책(미지정 시 ChargeProperties 기본값으로 동작).
wallet:
  charge:
    single-limit: 10000000   # 단일 거래 충전 한도(KRW). 초과 시 ACCOUNT4007(명세 §12)
  exchange:
    fee-rate: 0.005          # 환전 수수료율(KRW 환산액 기준, 임시 정책 — 운영 확정 시 교체). 미지정 시 ExchangeProperties 기본값(0.5%)
  account:
    # 계좌 인증(verify) rate-limit. 사용자(public_id) 단위 고정 윈도(WACC-02). 미지정 시 VerifyRateLimitProperties 기본값(60s/10회).
    verify-rate-limit:
      window-seconds: 60     # 카운터 윈도(초)
      limit: 10              # 윈도 내 허용 호출 수. 초과 시 ACCOUNT4005(429). Redis 장애 시 fail-open
  reward:
    # 송금 적립/쿠폰 정책(#215). 미지정 시 RewardProperties 기본값(5칸/90일)으로 동작.
    stamps-per-coupon: 5     # 쿠폰 1장 발급에 필요한 스탬프 수(카드 한 장의 칸 수)
    coupon-valid-days: 90    # 발급 쿠폰 유효기간(일)

# app-admin-service 연동 (수수료 정책 조회)
app-admin:
  api:
    base-url: ${APP_ADMIN_API_BASE_URL:http://localhost:8086}