spring:
  application:
    name: wallet-service
  profiles:
    # 기본 활성 프로파일. IDE/CLI에서 SPRING_PROFILES_ACTIVE 등으로 덮어쓸 수 있다.
    active: dev
  jackson:
    # 전역 설정: 모든 응답 JSON 필드명을 camelCase → snake_case로 직렬화 (명세 규칙).
    property-naming-strategy: SNAKE_CASE

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health, info

# 충전 정책(미지정 시 ChargeProperties 기본값으로 동작).
wallet:
  charge:
    single-limit: 10000000   # 단일 거래 충전 한도(KRW). 초과 시 ACCOUNT4007(명세 §12)
  account:
    # 계좌 인증(verify) rate-limit. IP 단위 고정 윈도. 미지정 시 VerifyRateLimitProperties 기본값(60s/10회).
    verify-rate-limit:
      window-seconds: 60     # 카운터 윈도(초)
      limit: 10              # 윈도 내 허용 호출 수. 초과 시 ACCOUNT4005(429). Redis 장애 시 fail-open