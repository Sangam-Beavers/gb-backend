dependencies {
    implementation project(':common:common-exception')
    implementation project(':common:common-response')
    implementation project(':common:common-security')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 방식 B: 외부 IdP가 발급한 JWT를 검증만 하는 "검표원"(Resource Server). issuer-uri로 JWKS 검증.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // data-redis 제거(미사용) — 조회수 Redis 카운터(database.md §7 계획) 도입 시 dev yml 설정과 함께 복원.
    //   미사용인데 클래스패스에 있으면 actuator health가 Redis ping을 포함해 무관한 Redis 장애에 unhealthy가 된다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    // CLAUDE.md §5 / §12 표준 버전 2.8.14로 정렬(기존 스켈레톤 2.3.0 → 2.8.14, wallet·member-service와 동일).
    // 2.8.15~2.8.17은 swagger-initializer.js 경로 패턴 회귀 버그로 기동 실패 → 2.8.14가 2.8 계열 마지막 정상 버전.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

    // 번역 Lambda(계정 B) 호출용 AWS SigV4 서명 — Lambda Function URL의 AuthType: AWS_IAM 통과.
    // (BedrockTranslationClient는 stage·prod에서만 활성화되지만, dev에서도 클래스패스 컴파일은 필요하므로
    // implementation으로 둔다. Mock 프로파일에서는 빈이 생성되지 않아 자격증명 조회도 일어나지 않는다.)
    implementation 'software.amazon.awssdk:auth:2.28.16'
    implementation 'software.amazon.awssdk:http-client-spi:2.28.16'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // 테스트 전용 인메모리 DB. spring-boot-starter-test는 루트 build.gradle subprojects에서 이미 적용됨.
    testRuntimeOnly 'com.h2database:h2'
    // 컨트롤러 슬라이스 테스트에서 jwt() 요청 후처리기로 인증 주체를 주입하기 위해 필요(spring-boot-starter-test 미포함).
    testImplementation 'org.springframework.security:spring-security-test'
}