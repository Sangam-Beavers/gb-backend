# stage 프로파일 — 모든 값은 환경변수로 주입 (실제 값 절대 기재 금지)
# DB:    SM(sb/stage/community/db)  → ESO → k8s Secret
# Redis: SM(sb/stage/redis/auth)    → ESO → k8s Secret (공용)
# Auth:  PS(/sb/stage/community/AUTH_ISSUER_URI) → ESO → k8s Secret
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}          # SM: primary_host
      port: ${REDIS_PORT}          # SM: port
      password: ${SPRING_DATA_REDIS_PASSWORD}  # SM: auth_token
      database: 0
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:true}  # SM: tls

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI}  # PS: /sb/stage/community/AUTH_ISSUER_URI

# member-service 내부 호출 — MEMBER_API_BASE_URL (ConfigMap)
member:
  api:
    base-url: ${MEMBER_API_BASE_URL}

# 번역 Lambda (계정 B Bedrock) — stage에서는 실제 Lambda 호출
# TRANSLATION_LAMBDA_URL, TRANSLATION_AWS_REGION: ConfigMap
translation:
  client: bedrock
  lambda:
    url: ${TRANSLATION_LAMBDA_URL}
  aws:
    region: ${TRANSLATION_AWS_REGION:ap-northeast-2}
