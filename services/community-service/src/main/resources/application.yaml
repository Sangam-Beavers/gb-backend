spring:
  application:
    name: community-service
  # 기본 프로파일을 dev로 둔다. 운영/스테이징은 SPRING_PROFILES_ACTIVE로 덮어쓴다.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # CLAUDE.md §5: JSON 필드는 snake_case. DTO 필드는 camelCase로 두고 전역 변환에 의존.
  jackson:
    property-naming-strategy: SNAKE_CASE
  kafka:
    # Kafka 브로커 주소 — 환경변수 주입(Phase 2 스파이크 결정 6, env 분리 패턴 동일).
    # 브로커 미기동 환경(dev 로컬 등)에서도 앱은 정상 기동하고, 발행 실패만 ERROR 로그로 남는다(BE-8).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Phase 3(BE-8) — 마일스톤 이벤트 발행(Kafka Producer). KafkaProducerConfig 참조.
gb:
  kafka:
    producer:
      # 브로커 미가용 시 send() 블로킹 상한(ms, Kafka 기본 60s). AFTER_COMMIT 발행이 API 응답
      # 스레드에서 동기 실행되므로 짧게 캡해 Kafka 장애가 글/댓글 작성 응답 지연으로 번지지 않게 한다.
      max-block-ms: 3000

server:
  port: 8082

# 계정 B 번역 Lambda(gb-community-translator) — 표준 Lambda Invoke API로 호출(stage·prod).
# dev/test는 MockTranslationClient가 활성화돼 본 설정을 읽지 않는다(빈 값이어도 무방).
translation:
  lambda:
    # 함수명만 있으면 됨(URL 불필요). 환경변수 TRANSLATION_LAMBDA_FUNCTION_NAME로 덮어쓰기 가능.
    function-name: ${TRANSLATION_LAMBDA_FUNCTION_NAME:gb-community-translator}
  aws:
    region: ${TRANSLATION_AWS_REGION:ap-northeast-2}

management:
  endpoints:
    web:
      exposure:
        # Phase 1: prometheus 엔드포인트 노출(Phase 2에서 Prometheus가 스크레이프).
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s