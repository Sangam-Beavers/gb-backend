spring:
  application:
    name: community-service
  # 기본 프로파일을 dev로 둔다. 운영/스테이징은 SPRING_PROFILES_ACTIVE로 덮어쓴다.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # CLAUDE.md §5: JSON 필드는 snake_case. DTO 필드는 camelCase로 두고 전역 변환에 의존.
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, info