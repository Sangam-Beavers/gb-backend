spring:
  application:
    name: community-service
  # 기본 프로파일을 dev로 둔다. 운영/스테이징은 SPRING_PROFILES_ACTIVE로 덮어쓴다.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # CLAUDE.md §5: JSON 필드는 snake_case. DTO 필드는 camelCase로 두고 전역 변환에 의존.
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8082

# 계정 B 번역 Lambda(Bedrock Claude Haiku) — stage·prod에서만 실제 호출.
# dev/test는 MockTranslationClient가 활성화돼 본 설정을 읽지 않는다(빈 값이어도 무방).
translation:
  lambda:
    # 환경별 yml(application-{stage|prod}.yml) 또는 환경변수 TRANSLATION_LAMBDA_URL로 주입.
    url: ${TRANSLATION_LAMBDA_URL:}
  aws:
    region: ${TRANSLATION_AWS_REGION:ap-northeast-2}

management:
  endpoints:
    web:
      exposure:
        # Phase 1: prometheus 엔드포인트 노출(Phase 2에서 Prometheus가 스크레이프).
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s