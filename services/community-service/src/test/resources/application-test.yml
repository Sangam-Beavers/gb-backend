# 테스트 전용 프로파일. @ActiveProfiles("test")로 활성화.
# 인메모리 H2(MySQL 호환 모드)로 Repository 통합 테스트를 돌린다 — 개발기 DB는 절대 만지지 않는다.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop          # 테스트마다 스키마 생성/삭제
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: never
  jackson:
    # main과 동일한 전역 규칙(응답 JSON 검증 시 대비).
    property-naming-strategy: SNAKE_CASE