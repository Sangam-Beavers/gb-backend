spring:
  application:
    name: member-service
  # 기본 활성 프로파일을 dev로 둔다(타 3서비스와 정합 — 10D config-build-2). 미지정 시 application-dev.yml
  # (datasource/redis/mail/oauth2/crypto)이 로드되지 않아 기동이 실패한다. 운영/스테이징은
  # SPRING_PROFILES_ACTIVE 환경변수로 덮어쓴다(community/document와 동일 패턴).
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    property-naming-strategy: SNAKE_CASE
  kafka:
    # Kafka 브로커 주소 — 환경변수 주입(Phase 2 스파이크 결정 6, env 분리 패턴 동일).
    # Consumer 상세(역직렬화·재시도·DLT)는 KafkaConsumerConfig 참조. 브로커 미기동 시 앱은 정상
    # 기동하고 리스너가 백그라운드에서 재연결을 시도한다(이벤트는 토픽에 7일 보관 — 늦게 떠도 따라잡음).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Phase 2 — 마일스톤 이벤트 수신(Kafka Consumer, BE-4).
gb:
  kafka:
    milestone-consumer:
      # 리스너 자동 시작 여부. 운영 계열은 true(기본), test 프로파일만 false(application-test.yml —
      # 브로커 없는 테스트 컨텍스트에서 무의미한 재연결 시도 차단. EmbeddedKafka 테스트는 인라인으로 켬).
      auto-startup: true

# 운영/스테이징 IdP(AWS Cognito) 설정 — prod/stage 프로필에서만 사용(CognitoClientConfig·CognitoIdpUserClient).
# dev/test는 Authentik(RealIdpUserClient)이라 아래 값이 필요 없다. 실제 값은 환경변수로만 주입한다
# (커밋되는 이 파일엔 placeholder만 — 운영 yml/시크릿에서 COGNITO_* 주입). 가입 시 Cognito 관리 API 호출에 사용.
#   - COGNITO_REGION        예: ap-northeast-2
#   - COGNITO_USER_POOL_ID  예: ap-northeast-2_KP2h2Oq2z
# 또한 SecurityConfig issuer-uri(AUTH_ISSUER_URI)를 Cognito issuer로 두어야 검표원이 Cognito 토큰을 신뢰한다:
#   https://cognito-idp.${COGNITO_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}
auth:
  cognito:
    region: ${COGNITO_REGION:}
    user-pool-id: ${COGNITO_USER_POOL_ID:}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # Phase 1: prometheus 엔드포인트 노출(Phase 2에서 Prometheus가 스크레이프).
        include: health, info, prometheus
  health:
    # MailHealthIndicator를 끈다. 켜져 있으면 /actuator/health 호출마다 JavaMailSender.testConnection()이
    # smtp.gmail.com:587에 실제 SMTP 로그인을 한다. K8s 프로브(매 10s)+admin 모니터링이 헬스를 폴링하면
    # 시간당 수백 회 로그인이 되어 Gmail이 "454-4.7.0 Too many login attempts"로 차단한다(앱 비번 정상이어도).
    # 실제 메일 발송(EmailSender)은 영향 없음 — 헬스 체크의 SMTP 로그인만 비활성화.
    mail:
      enabled: false
  metrics:
    tags:
      # Prometheus 레이블: 서비스 구분. Grafana에서 application="member-service" 로 필터링.
      application: ${spring.application.name}
    distribution:
      # HTTP 레이턴시 histogram 활성화 — p95/p99 계산에 필요. Prometheus 없을 때는 메모리에만 유지.
      percentiles-histogram:
        http.server.requests: true
      # SLO 버킷 경계(ms). Grafana에서 "p95 < 200ms" 같은 SLO 패널을 그릴 때 사용.
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s