spring:
  application:
    name: member-service
  # 기본 활성 프로파일을 dev로 둔다(타 3서비스와 정합 — 10D config-build-2). 미지정 시 application-dev.yml
  # (datasource/redis/mail/oauth2/crypto)이 로드되지 않아 기동이 실패한다. 운영/스테이징은
  # SPRING_PROFILES_ACTIVE 환경변수로 덮어쓴다(community/document와 동일 패턴).
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    property-naming-strategy: SNAKE_CASE

# 운영/스테이징 IdP(AWS Cognito) 설정 — prod/stage 프로필에서만 사용(CognitoClientConfig·CognitoIdpUserClient).
# dev/test는 Authentik(RealIdpUserClient)이라 아래 값이 필요 없다. 실제 값은 환경변수로만 주입한다
# (커밋되는 이 파일엔 placeholder만 — 운영 yml/시크릿에서 COGNITO_* 주입). 가입 시 Cognito 관리 API 호출에 사용.
#   - COGNITO_REGION        예: ap-northeast-2
#   - COGNITO_USER_POOL_ID  예: ap-northeast-2_KP2h2Oq2z
# 또한 SecurityConfig issuer-uri(AUTH_ISSUER_URI)를 Cognito issuer로 두어야 검표원이 Cognito 토큰을 신뢰한다:
#   https://cognito-idp.${COGNITO_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}
auth:
  cognito:
    region: ${COGNITO_REGION:}
    user-pool-id: ${COGNITO_USER_POOL_ID:}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # Phase 1: prometheus 엔드포인트 노출(Phase 2에서 Prometheus가 스크레이프).
        include: health, info, prometheus
  metrics:
    tags:
      # Prometheus 레이블: 서비스 구분. Grafana에서 application="member-service" 로 필터링.
      application: ${spring.application.name}
    distribution:
      # HTTP 레이턴시 histogram 활성화 — p95/p99 계산에 필요. Prometheus 없을 때는 메모리에만 유지.
      percentiles-histogram:
        http.server.requests: true
      # SLO 버킷 경계(ms). Grafana에서 "p95 < 200ms" 같은 SLO 패널을 그릴 때 사용.
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s