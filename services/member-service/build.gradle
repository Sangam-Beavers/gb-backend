dependencies {
    implementation project(':common:common-exception')
    implementation project(':common:common-response')
    implementation project(':common:common-security')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 방식 B: 외부 IdP가 발급한 JWT를 검증만 하는 "검표원"(Resource Server). issuer-uri로 JWKS 검증.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Phase 1: /actuator/prometheus 노출용 — Phase 2(Grafana/Prometheus 인프라)에서 스크레이프할 자리.
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // 메일 발송(비밀번호 재설정·가입 인증 이메일). JavaMailSender + Gmail SMTP.
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

    // 운영/스테이징 IdP(Cognito) 관리 API 호출용 AWS SDK v2 (가입 시 사용자 생성/비번설정 등).
    // BOM으로 버전 관리 → 모듈 버전을 개별 명시하지 않는다. dev/test는 Authentik이라 런타임 미사용.
    implementation platform('software.amazon.awssdk:bom:2.28.16')
    implementation 'software.amazon.awssdk:cognitoidentityprovider'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // 테스트는 인메모리 H2(MySQL 호환 모드)로 돈다 — 개발기 DB는 만지지 않는다(CLAUDE §10).
    testRuntimeOnly 'com.h2database:h2'
    // 컨트롤러 슬라이스 테스트에서 jwt() 요청 후처리기로 인증 주체를 주입하기 위해 필요(spring-boot-starter-test 미포함).
    testImplementation 'org.springframework.security:spring-security-test'
}