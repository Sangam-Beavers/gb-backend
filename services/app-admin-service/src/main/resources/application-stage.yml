# stage 프로파일 — 모든 값은 환경변수로 주입 (실제 값 절대 기재 금지)
# DB:   SM(sb/stage/app-admin/db)            → ESO → k8s Secret (DB_HOST/PORT/NAME, USERNAME/PASSWORD)
# Auth: PS(/sb/stage/member/AUTH_ISSUER_URI) → ESO → k8s Secret (member와 공용 Cognito issuer)
# 내부 서비스 URL(MEMBER_INTERNAL_URL/COMMUNITY_INTERNAL_URL)은 비밀 아님 → ConfigMap 주입(application.yaml 기본값 override)
# app-admin은 Redis/Kafka/Mail 미사용 — 해당 설정 없음
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # stage 검증 한정(자동 스키마 생성) — 타 서비스 stage와 동일 정책. prod는 validate + 수동 DDL/마이그레이션.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # AUTH_ISSUER_URI = Cognito issuer (PS /sb/stage/member/AUTH_ISSUER_URI → k8s Secret, member와 공용)
          issuer-uri: ${AUTH_ISSUER_URI}
# 관리자 경로 /api/v1/app-admin/admin/** 는 SecurityConfig가 항상 Cognito admin 그룹(cognito:groups=admin)으로
# 보호한다(플래그 불필요·fail-closed). 앱 사용자용 /api/v1/app-admin/app/** 는 공개 유지.
