spring:
  application:
    name: admin-service
  profiles:
    # 기본 활성 프로파일을 dev로 둔다(타 서비스와 동일 패턴).
    # 운영/스테이징은 SPRING_PROFILES_ACTIVE 환경변수로 덮어쓴다.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    # 전역 설정: 모든 응답 JSON 필드명을 camelCase → snake_case로 직렬화 (명세 규칙).
    property-naming-strategy: SNAKE_CASE

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        # Phase 1: prometheus 엔드포인트 노출(추후 Phase 2에서 Prometheus가 스크레이프).
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s

# 모니터링 — 다른 서비스의 /actuator/health 호출 base URL. dev 기본값은 로컬 포트.
# 환경별 yml에서 덮어쓴다(stage/prod는 k8s 내부 DNS 등).
admin:
  # 인프라 경보용 Prometheus instant query base-url. 비우면 infra-alerts는 빈 목록(fail-soft).
  # stage: monitoring 네임스페이스의 kube-prometheus-stack Prometheus 서비스(크로스 NS DNS).
  prometheus:
    base-url: ${PROMETHEUS_BASE_URL:}
  service-health:
    urls:
      member: ${MEMBER_HEALTH_URL:http://localhost:8081}
      community: ${COMMUNITY_HEALTH_URL:http://localhost:8082}
      document: ${DOCUMENT_HEALTH_URL:http://localhost:8083}
      wallet: ${WALLET_HEALTH_URL:http://localhost:8084}
    timeout-ms: 1000
  # 도메인 서비스 /internal/admin/* 호출 base URL. 다음 스프린트에 mTLS·NetworkPolicy 로 격리.
  internal-api:
    urls:
      member: ${MEMBER_INTERNAL_URL:http://localhost:8081}
      community: ${COMMUNITY_INTERNAL_URL:http://localhost:8082}
      document: ${DOCUMENT_INTERNAL_URL:http://localhost:8083}
      wallet: ${WALLET_INTERNAL_URL:http://localhost:8084}
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
  # 모니터링 관련 설정 묶음.
  #  - configs: 운영 정책 미러 (실제 wallet 정책과 동기화는 다음 스프린트, monitoring/config API에서 노출)
  #  - embeds:  Phase 2 (Grafana/ArgoCD) 임베드 URL. base-url + path 조합으로 최종 url을 빌드
  #             (MonitoringServiceImpl.embeds()). 환경별 yml에서 base-url을 덮어쓰고,
  #             dashboards/argocd.path는 동일하게 유지. 응답 JSON shape(grafana=[{name,label,url}],
  #             argocd={url})은 프론트가 그대로 쓰고 있으므로 유지.
  monitoring:
    configs:
      wallet-charge-single-limit: 10000000
      wallet-exchange-fee-rate: "0.005"
      wallet-account-verify-rate-limit-window-seconds: 60
      wallet-account-verify-rate-limit-limit: 10
    embeds:
      grafana:
        base-url: ${GRAFANA_BASE_URL:http://localhost:3000}
        # UID는 stage Grafana에 실제 프로비저닝된 대시보드 기준(docs/monitoring/grafana-prometheus-setup.md §3-1).
        # ⚠️ 순서 = 앱 운영 중요도순(프론트가 받은 순서대로 위→아래로 렌더). 앱 자체 헬스에
        #    가장 가까운 것부터: Spring Boot HTTP(요청량/에러/지연) → JVM(힙/GC) → K8s 클러스터(자원) → AWS 데이터계층.
        # ⚠️ gnetId 임포트 대시보드(spring_boot/jvm)는 재프로비저닝 시 UID가 바뀔 수 있다 → "Not found"면 실제 UID로 갱신.
        # Redis(exporter)·ArgoCD 임베드는 제거: ElastiCache는 AWS 임베드(YACE)가 대체, ArgoCD는 물리서버 별도 운영.
        dashboards:
          - name: spring_boot
            label: Spring Boot HTTP (APM)
            path: /d/X09JGT7Gz/java-springboot-apm?kiosk=tv&theme=dark
          - name: jvm
            label: JVM Micrometer
            path: /d/751f8ea6-6a45-42f4-b1e5-5fb8fedea2d7/jvm-micrometer?var-application=admin-service&kiosk=tv&theme=dark
          - name: kubernetes_cluster
            label: Kubernetes Cluster
            path: /d/efa86fd1d0c121a26444b636a3f509a8/kubernetes-compute-resources-cluster?kiosk=tv&theme=dark
          # 데이터 계층(AWS 매니지드) — YACE→Prometheus. UID는 gb-infra 대시보드 JSON에 고정(추측 불필요).
          - name: rds
            label: AWS RDS / Aurora
            path: /d/gb-aws-rds/aws-rds-aurora?kiosk=tv&theme=dark
          - name: elasticache
            label: AWS ElastiCache
            path: /d/gb-aws-elasticache/aws-elasticache?kiosk=tv&theme=dark
      argocd:
        base-url: ${ARGOCD_BASE_URL:http://localhost:8080}
        path: /applications?showSidebar=false