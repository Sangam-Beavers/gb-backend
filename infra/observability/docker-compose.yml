# 관측 스택 (Prometheus + Grafana).
# 실행: cd infra/observability && docker-compose up -d
# 접근: Prometheus = http://localhost:9090 / Grafana = http://localhost:3000 (admin/admin)
#
# 주의: 5개 서비스가 호스트(Windows/macOS)에서 돌아가는 경우, scrape 대상은
#       host.docker.internal:포트로 잡힌다 (prometheus.yml 참고).
#       Linux 서버에서 띄울 경우 docker network mode 변경 또는 prometheus.yml 호스트 조정 필요.
#
# K8s/EKS 전환: docs/admin/monitoring-infra.md 참고
#                (kube-prometheus-stack Helm + ServiceMonitor CRD)
version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gb-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux Docker 호환 (Mac/Windows는 자동)
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: gb-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
