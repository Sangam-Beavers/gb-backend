# Prometheus scrape 설정. 5개 Spring Boot 서비스의 /actuator/prometheus 수집.
# host.docker.internal: Docker 컨테이너에서 호스트 머신의 localhost에 접근하는 표준 호스트네임.
# EKS 전환 시 ServiceMonitor CRD로 교체 (docs/admin/monitoring-infra.md 참고).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: gb-local
    env: dev

scrape_configs:
  - job_name: 'member-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: member-service

  - job_name: 'community-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: community-service

  - job_name: 'document-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          service: document-service

  - job_name: 'wallet-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']
        labels:
          service: wallet-service

  - job_name: 'admin-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8085']
        labels:
          service: admin-service
